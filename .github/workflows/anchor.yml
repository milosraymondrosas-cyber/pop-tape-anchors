name: Anchor daily tape digest

on:
  schedule:
    # 06:25 UTC — 25 minutes after the market day completes.
    - cron: "25 6 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Market day (YYYY-MM-DD); empty = latest complete day"
        required: false

permissions:
  contents: write

jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch digest
        id: fetch
        run: |
          DAY="${{ github.event.inputs.day }}"
          URL="https://popularity.dev/api/public/tape-digest"
          if [ -n "$DAY" ]; then URL="$URL?day=$DAY"; fi
          BODY="$(curl -sf "$URL")"
          echo "$BODY" | python3 -m json.tool
          DAY_OUT="$(echo "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin)["day"])')"
          echo "$BODY" > "anchors/$DAY_OUT.json"
          echo "day=$DAY_OUT" >> "$GITHUB_OUTPUT"

      - name: Commit anchor
        run: |
          git config user.name "tape-anchor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add anchors/
          git diff --cached --quiet && { echo "anchor unchanged"; exit 0; }
          git commit -m "Anchor ${{ steps.fetch.outputs.day }}"
          git push
